<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joker Store | لوحة التحكم 🃏</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/edge.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-main { 
            padding: 40px 30px; 
            max-width: 1300px; 
            margin: 40px auto; 
            background: rgba(15, 12, 27, 0.92); /* حاوية رئيسية معتمة لعزل المحتوى */
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 242, 254, 0.15);
            border-radius: 24px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8);
            position: relative;
        }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: rgba(255, 255, 255, 0.03); padding: 20px; border-radius: 15px; border: 1px solid var(--border-color); text-align: center; }
        .stat-card h4 { color: var(--text-muted); font-size: 0.9rem; }
        .stat-card .value { font-size: 1.8rem; font-weight: bold; color: var(--primary-neon); margin-top: 10px; }
        
        .admin-table-container { background: rgba(0, 0, 0, 0.2); border-radius: 15px; border: 1px solid var(--border-color); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 800px; }
        th, td { padding: 15px; text-align: right; }
        
        .btn-action { padding: 8px 15px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-approve { background: #2ecc71; color: white; }
        .btn-reject { background: #e74c3c; color: white; margin-right: 5px; }
        .btn-action:hover { opacity: 0.8; transform: translateY(-2px); }
        
        .status-badge { padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; }
        .status-pending { background: rgba(255, 159, 67, 0.2); color: var(--accent-orange); }
    </style>
</head>
<body>
    <!-- حاوية التنبيهات السريعة -->
    <div id="toast-container" style="position: fixed; top: 20px; left: 20px; z-index: 10000; display: flex; flex-direction: column; gap: 10px; pointer-events: none;"></div>

    <header>
        <div class="header-container">
            <div class="logo-zone">
                <img src="image/logo.png" class="header-image">
                <h1 class="logo-text">JOKER <span class="highlight">ADMIN</span></h1>
            </div>
            <nav>
                <a href="index.html">🌐 عرض الموقع</a>
                <a href="#" id="syncBtn" style="color: var(--accent-orange);"><i class="fas fa-sync"></i> مزامنة المنتجات</a>
                <div style="display: flex; align-items: center; gap: 8px; padding: 0 15px; border-left: 1px solid var(--border-color); border-right: 1px solid var(--border-color); margin: 0 5px;">
                    <label class="switch" style="position: relative; display: inline-block; width: 40px; height: 20px;">
                        <input type="checkbox" id="soundToggle" checked style="opacity: 0; width: 0; height: 0;">
                        <span class="slider" style="position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(255,255,255,0.1); transition: .4s; border-radius: 20px; border: 1px solid var(--border-color);"></span>
                    </label>
                    <span style="font-size: 0.8rem; color: var(--text-muted);"><i class="fas fa-volume-up" id="soundIcon"></i></span>
                </div>
                <a href="#" id="logoutBtn">🚪 تسجيل الخروج</a>
            </nav>
        </div>
    </header>

    <main class="admin-main">
        <div class="stats-grid">
            <div class="stat-card"><h4>الطلبات المعلقة</h4><div class="value" id="pendingCount">0</div></div>
            <div class="stat-card"><h4>إجمالي المبيعات</h4><div class="value" id="totalSales">0$</div></div>
            <div class="stat-card"><h4>أكواد متاحة</h4><div class="value" id="stockCount">0</div></div>
            <div class="stat-card"><h4>أرصدة المزودين</h4><div class="value" id="providerStatus" style="font-size: 0.9rem; color: #9b59b6;">جاري التحقق...</div></div>
        </div>

        <h2 style="margin-bottom: 20px; color: var(--primary-neon); display: flex; align-items: center; gap: 15px;">
            <i class="fas fa-tasks"></i> الطلبات الجديدة
            <select id="orderFilter" style="padding: 6px 12px; border-radius: 8px; background: var(--card-bg); color: white; border: 1px solid var(--border-color); font-size: 0.85rem; cursor: pointer; margin-right: auto; outline: none;">
                <option value="all">جميع الطلبات</option>
                <option value="low_profit">أرباح منخفضة (< 5%) ⚠️</option>
            </select>
        </h2>

        <div class="admin-table-container">
            <table>
                <thead>
                    <tr>
                        <th>رقم الطلب</th><th>الزبون</th><th>المنتج</th><th>وسيلة الدفع</th><th>رقم العملية</th><th>سعر التكلفة</th><th>الإجراء</th>
                    </tr>
                </thead>
                <tbody id="ordersTableBody">
                    <!-- سيتم تعبئتها عبر JS -->
                </tbody>
            </table>
        </div>
    </main>
    <script src="admin.js"></script>
</body>
</html>
