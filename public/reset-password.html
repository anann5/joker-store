<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="icon" type="image/png" href="/image/logo.png">
    <meta name="theme-color" content="#0B0F1C">
    <meta name="robots" content="noindex, nofollow">
    <title>Joker Store | اختيار كلمة مرور جديدة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="/theme.js?v=13"></script>
    <link rel="stylesheet" href="/style.css?v=14">
</head>
<body class="reset-page" data-page="reset">
    <main class="reset-card">
        <img src="/image/logo.png" alt="Joker Store" class="reset-logo">
        <h1 data-i18n-key="reset_title">اختيار كلمة مرور جديدة</h1>
        <p class="reset-desc" data-i18n-key="reset_desc">اختر كلمة مرور قوية لحسابك: 8 أحرف على الأقل مع حرف كبير وحرف صغير ورقم.</p>
        <form id="resetForm" novalidate>
            <div class="form-group">
                <label for="resetPasswordInput" data-i18n-key="reset_password_label">كلمة المرور الجديدة</label>
                <input type="password" id="resetPasswordInput" name="password" autocomplete="new-password" minlength="8" required>
            </div>
            <div class="form-group">
                <label for="resetConfirmInput" data-i18n-key="reset_confirm_label">تأكيد كلمة المرور</label>
                <input type="password" id="resetConfirmInput" name="confirm" autocomplete="new-password" minlength="8" required>
            </div>
            <button type="submit" class="auth-submit-btn" id="resetSubmit" data-i18n-key="reset_submit">حفظ كلمة المرور</button>
        </form>
        <p id="resetStatus" class="reset-status" role="status" aria-live="polite"></p>
        <a href="/forgot-password" id="requestAgainLink" class="reset-back" data-i18n-key="reset_request_again" hidden>طلب رابط جديد</a>
        <a href="/" class="reset-back" data-i18n-key="sub_back_home">العودة للمتجر</a>
    </main>
    <script type="module" src="/password-reset.js?v=1"></script>
    <script src="/sw-register.js" defer></script>
</body>
</html>
