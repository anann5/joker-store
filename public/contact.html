<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تواصل معنا | Joker Store</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
        main { max-width: 900px; margin: 0 auto; padding: 48px 24px 80px; }
        h1 { color: #ffffff; }
        .card { background: #111827; border: 1px solid #334155; border-radius: 16px; padding: 24px; margin-top: 20px; }
        form { display: grid; gap: 12px; }
        input, textarea, button { padding: 12px; border-radius: 10px; border: 1px solid #334155; font-size: 16px; }
        button { background: #38bdf8; color: #0f172a; font-weight: bold; cursor: pointer; }
        #result { margin-top: 12px; color: #86efac; }
    </style>
</head>
<body>
    <main>
        <h1>تواصل معنا</h1>
        <div class="card">
            <p>إذا كان لديك أي سؤال أو مشكلة، يمكنك التواصل معنا عبر البريد الإلكتروني أو عبر الحسابات الرسمية.</p>
            <p>البريد: support@jokerstore.com</p>
        </div>
        <div class="card">
            <form id="contactForm">
                <input type="text" id="name" name="name" placeholder="الاسم" required />
                <input type="email" id="email" name="email" placeholder="البريد الإلكتروني" required />
                <textarea id="message" name="message" rows="5" placeholder="رسالتك" required></textarea>
                <button type="submit">إرسال الرسالة</button>
            </form>
            <div id="result"></div>
        </div>
    </main>
    <script>
        document.getElementById('contactForm').addEventListener('submit', async (event) => {
            event.preventDefault();
            const form = event.target;
            const result = document.getElementById('result');
            const payload = {
                name: form.name.value,
                email: form.email.value,
                message: form.message.value
            };

            result.textContent = 'جارٍ الإرسال...';
            const response = await fetch('/api/contact', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await response.json();
            result.textContent = data.message || 'تم إرسال الرسالة';
            if (response.ok) form.reset();
        });
    </script>
</body>
</html>
