<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>الأسئلة الشائعة | Joker Store</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
        main { max-width: 900px; margin: 0 auto; padding: 48px 24px 80px; }
        h1, h2 { color: #ffffff; }
        .card { background: #111827; border: 1px solid #334155; border-radius: 16px; padding: 24px; margin-top: 20px; }
    </style>
</head>
<body>
    <main>
        <h1>الأسئلة الشائعة</h1>
        <div class="card">
            <h2>كيف يتم استلام الكود؟</h2>
            <p>بعد تأكيد الدفع وإتمام الطلب، سيتم إرسال الكود أو تفاصيل الشحن إلى البريد الإلكتروني المسجل أو إلى لوحة الإدارة حسب نوع الطلب.</p>
        </div>
        <div class="card">
            <h2>هل يمكنني استرجاع الطلب؟</h2>
            <p>بشكل عام لا يمكن استرجاع الطلب بعد تأكيد الشحن أو تسليم الكود، إلا في حالات خاصة ومحددة.</p>
        </div>
    </main>
</body>
</html>
