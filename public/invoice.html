<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/image/logo.png" />
    <link rel="apple-touch-icon" href="/image/logo.png" />
    <link rel="manifest" href="/manifest.json?v=6" />
    <meta name="theme-color" content="#0B0F1C" />
    <link rel="canonical" href="/invoice" />
    <title data-page-title-key="invoice_heading">فاتورة طلب | Joker Store</title>
    <meta name="description" content="فاتورة الطلب المدفوعة من Joker Store — يمكنك طباعتها أو حفظها PDF." data-i18n-meta="invoice_meta_desc" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha384-iw3OoTErCYJJB9mCa8LNS2hbsQ7M3C0EpIsO/H5+EGAkPGc6rk+V8i04oW/K5xq0" crossorigin="anonymous" />
    <script src="/theme.js?v=13"></script>
    <link rel="stylesheet" href="style.css?v=13" />
</head>
<body>

    <!-- هيدر ثانوي موحد -->
    <header class="sub-header">
        <div class="header-container">
            <a href="/" class="logo-zone" title="العودة للرئيسية" data-i18n-title="header_logo_title">
                <span class="logo-text">JOKER <span class="highlight">STORE</span></span>
                <img src="/image/logo.png" alt="Logo" class="header-image" />
            </a>
            <nav>
                <a href="/" data-i18n-key="nav_home">الرئيسية</a>
                <a href="/track" data-i18n-key="track_footer_btn">تتبع طلبك</a>
                <a href="/contact" data-i18n-key="sub_footer_contact">تواصل معنا</a>
                <a href="/support" data-i18n-key="sub_footer_support">الدعم الفني</a>
            </nav>
            <div class="header-controls">
                <button id="themeToggleBtn" class="header-btn theme-toggle-btn" title="تبديل المظهر (فاتح / داكن / النظام)" aria-label="تبديل المظهر">
                    <i class="fas fa-moon"></i>
                </button>
                <button id="lang-switcher" class="header-btn" title="Switch Language">
                    <i class="fas fa-globe"></i><span>EN</span>
                </button>
            </div>
        </div>
    </header>

    <main class="sub-page-main">
        <div class="sub-page-hero">
            <h1><i class="fas fa-file-invoice"></i><span data-i18n-key="invoice_heading">الفاتورة</span></h1>
        </div>

        <div class="sub-page-card">
            <div id="invoiceActions" class="invoice-actions" style="display:none;">
                <button type="button" id="invoicePrintBtn" class="enter-btn"><i class="fas fa-print"></i> <span data-i18n-key="invoice_print_btn">طباعة / حفظ PDF</span></button>
                <a id="invoiceWhatsappBtn" href="#" target="_blank" rel="noopener" class="enter-btn whatsapp-btn" style="display:none;"><i class="fab fa-whatsapp"></i> <span data-i18n-key="invoice_whatsapp_btn">نسخة عبر واتساب</span></a>
                <a href="/track" class="enter-btn" style="text-decoration:none;"><i class="fas fa-search"></i> <span data-i18n-key="track_btn">تتبع الآن</span></a>
            </div>
            <div id="invoiceSheet" class="invoice-sheet"></div>
        </div>
    </main>

    <!-- فوتر موحد -->
    <footer>
        <div class="footer-container">
            <div class="footer-brand">
                <span class="logo-text">JOKER <span class="highlight">STORE</span></span>
                <p class="footer-slogan" data-i18n-key="footer_slogan">بوابتك الآمنة لشحن الألعاب والبطاقات الرقمية فورياً وبأعلى تشفير.</p>
            </div>
            <hr class="footer-divider">
            <div class="footer-links">
                <a href="/about" data-i18n-key="sub_footer_about">من نحن</a>
                <a href="/privacy" data-i18n-key="sub_footer_privacy">سياسة الخصوصية</a>
                <a href="/terms" data-i18n-key="sub_footer_terms">الشروط والأحكام</a>
                <a href="/faq" data-i18n-key="sub_footer_faq">الأسئلة الشائعة</a>
                <a href="/contact" data-i18n-key="sub_footer_contact">تواصل معنا</a>
            </div>
            <p class="copyright" data-i18n-key="copyright_text">© 2026 Joker Store — جميع الحقوق محفوظة</p>
        </div>
    </footer>

    <script type="module" src="sub-page.js"></script>
    <script type="module" src="invoice.js"></script>
</body>
</html>
