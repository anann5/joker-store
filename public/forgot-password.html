<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="icon" type="image/png" href="/image/logo.png">
    <meta name="theme-color" content="#0B0F1C">
    <meta name="robots" content="noindex, nofollow">
    <title>Joker Store | استعادة كلمة المرور</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="/theme.js?v=13"></script>
    <link rel="stylesheet" href="/style.css?v=14">
</head>
<body class="reset-page" data-page="forgot">
    <main class="reset-card">
        <img src="/image/logo.png" alt="Joker Store" class="reset-logo">
        <h1 data-i18n-key="forgot_title">استعادة كلمة المرور</h1>
        <p class="reset-desc" data-i18n-key="forgot_desc">أدخل بريدك الإلكتروني وسنرسل لك رابطاً لإعادة تعيين كلمة المرور.</p>
        <form id="forgotForm" novalidate>
            <div class="form-group">
                <label for="forgotEmail" data-i18n-key="auth_email_label">البريد الإلكتروني</label>
                <input type="email" id="forgotEmail" name="email" autocomplete="email" required>
            </div>
            <button type="submit" class="auth-submit-btn" id="forgotSubmit" data-i18n-key="forgot_submit">إرسال رابط الاستعادة</button>
        </form>
        <p id="forgotStatus" class="reset-status" role="status" aria-live="polite"></p>
        <div id="devResetLink" class="reset-dev-link"></div>
        <a href="/" class="reset-back" data-i18n-key="sub_back_home">العودة للمتجر</a>
    </main>
    <script type="module" src="/password-reset.js?v=1"></script>
    <script src="/sw-register.js" defer></script>
</body>
</html>
