<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>دخول الأدمن</title>
    <style>
        body {
            background: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
        }
        .box {
            background: #1e1e1e;
            padding: 40px;
            border-radius: 12px;
            border: 1px solid #333;
            text-align: center;
            width: 300px;
        }
        h2 { color: #ff9f43; margin-bottom: 25px; }
        input {
            width: 100%;
            padding: 12px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 8px;
            color: white;
            font-size: 15px;
            box-sizing: border-box;
            margin-bottom: 15px;
            text-align: center;
        }
        input:focus { border-color: #ff9f43; outline: none; }
        button {
            width: 100%;
            padding: 12px;
            background: #ff9f43;
            color: #121212;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover { background: #e08d30; }
        button:disabled { background: #555; cursor: not-allowed; }
        .error {
            color: #ff4d4d;
            margin-top: 10px;
            font-size: 13px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>🃏 دخول الأدمن</h2>
        <input type="password" id="passwordInput" placeholder="أدخل كلمة السر..." />
        <button id="loginBtn">دخول</button>
        <p class="error" id="errorMsg">❌ كلمة السر غلط!</p>
    </div>

    <script>
        async function login() {
            const password  = document.getElementById('passwordInput').value.trim();
            const loginBtn  = document.getElementById('loginBtn');
            const errorMsg  = document.getElementById('errorMsg');

            if (!password) return;

            errorMsg.style.display  = 'none';
            loginBtn.disabled       = true;
            loginBtn.textContent    = '⏳ جاري التحقق...';

            try {
                const response = await fetch('/admin', {
                    headers: { 'x-admin-token': password }
                });

                if (response.ok) {
                    // احفظ التوكن في الجلسة فقط
                    sessionStorage.setItem('adminToken', password);
                    // افتح صفحة الأدمن بدون كشف التوكن في الـ URL
                    const html = await response.text();
                    document.open('text/html', 'replace');
                    document.write(html);
                    document.close();
                    window.history.pushState({}, '', '/admin');
                } else {
                    errorMsg.textContent   = '❌ كلمة السر غلط!';
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                errorMsg.textContent   = '❌ حدث خطأ في الاتصال بالسيرفر';
                errorMsg.style.display = 'block';
            } finally {
                loginBtn.disabled    = false;
                loginBtn.textContent = 'دخول';
            }
        }

        document.getElementById('loginBtn').addEventListener('click', login);
        document.getElementById('passwordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') login();
        });
    </script>
</body>
</html>
