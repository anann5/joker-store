<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>دخول الأدمن</title>
    <style>
        body {
            background: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
        }
        .box {
            background: #1e1e1e;
            padding: 40px;
            border-radius: 12px;
            border: 1px solid #333;
            text-align: center;
            width: 300px;
        }
        h2 { color: #ff9f43; margin-bottom: 25px; }
        input {
            width: 100%;
            padding: 12px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 8px;
            color: white;
            font-size: 15px;
            box-sizing: border-box;
            margin-bottom: 15px;
            text-align: center;
        }
        input:focus { border-color: #ff9f43; outline: none; }
        button {
            width: 100%;
            padding: 12px;
            background: #ff9f43;
            color: #121212;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover { background: #e08d30; }
        button:disabled { background: #555; cursor: not-allowed; }
        .error {
            color: #ff4d4d;
            margin-top: 10px;
            font-size: 13px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>🃏 دخول الأدمن</h2>
        <input type="password" id="passwordInput" placeholder="أدخل كلمة السر..." />
        <button id="loginBtn">دخول</button>
        <p class="error" id="errorMsg">❌ كلمة السر غلط!</p>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = document.getElementById('password').value;
    const btn = document.querySelector('button');
    
    // تغيير حالة الزر أثناء التحقق
    btn.innerText = '⏳ جاري التحقق...';
    btn.disabled = true;

    try {
        const res = await fetch('/api/admin/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password })
        });
        
        const data = await res.json();

        if (data.success) {
            // تخزين التوكن فوراً بالمتصفح قبل التوجيه لمنع رسالة المودال اللعينة
            localStorage.setItem('adminToken', data.token);
            
            // توجيه مباشر إلى لوحة التحكم
            window.location.href = '/admin';
        } else {
            alert(data.error || 'الباسورد خاطئ!');
            btn.innerText = 'دخول الأدمن 🃏';
            btn.disabled = false;
        }
    } catch (err) {
        console.error(err);
        alert('حدث خطأ في الاتصال بالسيرفر');
        btn.innerText = 'دخول الأدمن 🃏';
        btn.disabled = false;
    }
});

        document.getElementById('loginBtn').addEventListener('click', login);
        document.getElementById('passwordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') login();
        });
    </script>
</body>
</html>
