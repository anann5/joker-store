<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joker Store | تسجيل الدخول 🔒</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .login-body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: var(--bg-dark);
        }
        .login-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid var(--primary-neon);
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.2);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-card h2 {
            color: var(--primary-neon);
            margin-bottom: 25px;
            letter-spacing: 2px;
        }
        .login-card input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 8px;
            border: 1px solid #333;
            background: #1a1a28;
            color: white;
            outline: none;
            transition: 0.3s;
        }
        .login-card input:focus {
            border-color: var(--primary-neon);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--primary-neon), var(--secondary-neon));
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 242, 254, 0.4);
        }
        .login-logo {
            width: 80px;
            margin-bottom: 15px;
        }
        .error-message {
            color: #e74c3c;
            margin-top: 15px;
            font-size: 0.9rem;
            display: none;
        }
        .error-message.visible {
            display: block;
        }
    </style>
</head>
<body class="login-body">
    <div class="login-card">
        <img src="/image/logo.png" alt="Logo" class="login-logo">
        <h2>دخول المسؤول</h2>
        <form id="loginForm">
            <input type="password" id="adminPassword" placeholder="أدخل كلمة مرور الإدارة" required>
            <button type="submit" class="login-btn">🔓 دخول للوحة التحكم</button>
        </form>
        <p id="errorMsg" class="error-message"></p>
    </div>
    <script src="login-admin.js"></script>
</body>
</html>
