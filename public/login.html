<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول الأدمن — جوكر ستور</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #1f2833;
            --primary: #a200ff;
            --primary-hover: #7b00cc;
            --text-color: #c5c6c7;
            --accent: #45f3ff;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(162, 0, 255, 0.2);
            border: 1px solid rgba(162, 0, 255, 0.3);
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-sizing: border-box;
        }

        h2 {
            color: #fff;
            margin-bottom: 30px;
            font-size: 24px;
        }
        h2 span { color: var(--accent); }

        .form-group {
            margin-bottom: 20px;
            text-align: right;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            background: #151a21;
            border: 1px solid #334155;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            text-align: center;
            font-size: 16px;
            letter-spacing: 2px;
        }

        input:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 8px rgba(162, 0, 255, 0.5);
        }

        button {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            font-size: 16px;
            transition: 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background: var(--primary-hover);
        }
        
        button:disabled {
            background: #444;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h2>🃏 دخول الأدمن — <span>JOKER</span></h2>
    
    <form id="loginForm">
        <div class="form-group">
            <label for="password">أدخل كلمة المرور الخاصة بالإدارة:</label>
            <input type="password" id="password" required placeholder="••••••••••••">
        </div>
        <button type="submit" id="loginBtn">دخول لوحة التحكم 🚀</button>
    </form>
</div>

<script>
    // التأكد من مسح أي توكن قديم معلق عند فتح صفحة اللوجن
    localStorage.removeItem('adminToken');

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const password = passwordInput.value;

        // تغيير شكل الزر لتعطيل الضغط المتكرر
        loginBtn.innerText = '⏳ جاري التحقق والدخول...';
        loginBtn.disabled = true;

        try {
            const res = await fetch('/api/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: password })
            });

            const data = await res.json();

            if (data.success) {
                // تخزين التوكن بالـ localStorage
                localStorage.setItem('adminToken', data.token);
                // توجيه مباشر ومضمون لصفحة الأدمن
                window.location.replace('/admin');
            } else {
                alert(data.error || 'كلمة المرور غير صحيحة!');
                loginBtn.innerText = 'دخول لوحة التحكم 🚀';
                loginBtn.disabled = false;
                passwordInput.value = '';
                passwordInput.focus();
            }
        } catch (err) {
            console.error('Error during login:', err);
            alert('حدث خطأ أثناء الاتصال بالسيرفر، حاول مجدداً.');
            loginBtn.innerText = 'دخول لوحة التحكم 🚀';
            loginBtn.disabled = false;
        }
    });
</script>

</body>
</html>
