<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول الأدمن — جوكر ستور</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #1f2833;
            --primary: #a200ff;
            --primary-hover: #7b00cc;
            --text-color: #c5c6c7;
            --accent: #45f3ff;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(162, 0, 255, 0.2);
            border: 1px solid rgba(162, 0, 255, 0.3);
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-sizing: border-box;
        }
        h2 { color: #fff; margin-bottom: 30px; font-size: 24px; }
        h2 span { color: var(--accent); }
        .form-group { margin-bottom: 20px; text-align: right; }
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; }
        input {
            width: 100%;
            padding: 12px;
            background: #151a21;
            border: 1px solid #334155;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            text-align: center;
            font-size: 16px;
        }
        input:focus { border-color: var(--primary); outline: none; }
        button {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            font-size: 16px;
            transition: 0.3s;
        }
        button:hover { background: var(--primary-hover); }
    </style>
</head>
<body>

<div class="login-card">
    <h2>🃏 دخول الأدمن — <span>JOKER</span></h2>
    
    <form id="jokerLoginForm">
        <div class="form-group">
            <label>أدخل كلمة المرور الخاصة بالإدارة:</label>
            <input type="password" id="jokerPassword" name="password" required placeholder="••••••••••••">
        </div>
        <button type="submit" id="jokerBtn">دخول لوحة التحكم 🚀</button>
    </form>
</div>

<script>
    
        document.getElementById('jokerLoginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const passwordField = document.getElementById('jokerPassword');
        const submitBtn = document.getElementById('jokerBtn');
        const passwordValue = passwordField.value.trim();

        submitBtn.innerText = '⏳ جاري التحقق...';
        submitBtn.disabled = true;

        try {
            const res = await fetch('/api/admin/login', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify({ password: passwordValue }) // إرسال صريح ومباشر
            });

            const data = await res.json();

            if (data.success && data.token) {
                // حفظ التوكن فوراً والتوجه للأدمن
                sessionStorage.setItem('adminToken', data.token);
             window.location.replace('/admin?token=' + data.token);
            } else {
                alert(data.error || 'كلمة المرور غير صحيحة!');
                submitBtn.innerText = 'دخول لوحة التحكم 🚀';
                submitBtn.disabled = false;
                passwordField.value = '';
                passwordField.focus();
            }
        } catch (err) {
            console.error('Login Error:', err);
            alert('حدث خطأ أثناء الاتصال بالسيرفر، تأكد من تحديث السيرفر.');
            submitBtn.innerText = 'دخول لوحة التحكم 🚀';
            submitBtn.disabled = false;
        }
    });
</script>

</body>
</html>
