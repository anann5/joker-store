<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joker Store | تسجيل الدخول 🔒</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
        <script src="/theme.js?v=13"></script>
<link rel="stylesheet" href="style.css?v=13">
    <style>
        .login-body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background:
                radial-gradient(600px 320px at 80% -10%, rgba(99, 102, 241, 0.28), transparent 60%),
                radial-gradient(520px 300px at 10% 110%, rgba(56, 189, 248, 0.18), transparent 60%),
                var(--bg-0);
        }
        .login-card {
            background: rgba(13, 17, 30, 0.82);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.09);
            box-shadow: 0 14px 34px rgba(3, 6, 14, 0.6), 0 0 22px rgba(99, 102, 241, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.07);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-card h2 {
            color: var(--primary-neon);
            margin-bottom: 25px;
            letter-spacing: 2px;
        }
        .login-card input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.045);
            color: white;
            outline: none;
            transition: 0.3s;
        }
        .login-card input:focus {
            border-color: var(--primary-neon);
            box-shadow: 0 0 10px rgba(129, 140, 248, 0.3);
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--primary-neon), var(--secondary-neon));
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.35);
        }
        .login-logo {
            width: 80px;
            margin-bottom: 15px;
        }
        .error-message {
            color: #FB7185;
            margin-top: 15px;
            font-size: 0.9rem;
            display: none;
        }
        .error-message.visible {
            display: block;
        }
    </style>
</head>
<body class="login-body">
    <div class="login-card">
        <img src="/image/logo.png" alt="Logo" class="login-logo">
        <h2>دخول المسؤول</h2>
        <form id="loginForm">
            <input type="password" id="adminPassword" placeholder="أدخل كلمة مرور الإدارة" required>
            <input type="text" id="adminTotp" placeholder="رمز التحقق الثنائي (إن وُجد)" inputmode="numeric" autocomplete="one-time-code" style="display:none;">
            <button type="submit" class="login-btn">🔓 دخول للوحة التحكم</button>
        </form>
        <p id="errorMsg" class="error-message"></p>
    </div>
    <script src="login-admin.js"></script>
</body>
</html>
