<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تتبع طلبك | Joker Store 🃏</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .track-container {
            max-width: 600px;
            margin: 100px auto;
            padding: 30px;
            background: rgba(20, 10, 35, 0.8);
            border-radius: 20px;
            border: 1px solid rgba(0, 242, 254, 0.3);
            text-align: center;
        }
        .track-input {
            width: 100%;
            padding: 15px;
            margin: 20px 0;
            border-radius: 10px;
            border: 1px solid #333;
            background: #0f0f18;
            color: #fff;
            font-size: 1.1rem;
            text-align: center;
            outline: none;
        }
        .track-input:focus { border-color: #00f2fe; }
        .status-card {
            margin-top: 30px;
            padding: 20px;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.05);
            display: none;
        }
        .status-pending { color: #ff9f43; }
        .status-completed { color: #2ecc71; }
        .status-failed { color: #e74c3c; }
    </style>
</head>
<body>
    <div class="track-container">
        <h2 style="color: #00f2fe;"><i class="fas fa-search-location"></i> تتبع حالة طلبك</h2>
        <p style="color: #ccc;">أدخل رقم الطلب الذي وصلك في الإيميل (مثال: JKR-123456)</p>
        
        <input type="text" id="orderIdInput" class="track-input" placeholder="رقم الطلب هنا...">
        <button id="trackBtn" class="buy-btn" style="width: auto; padding: 12px 40px;">بحث الآن</button>

        <div id="statusResult" class="status-card">
            <h3 id="orderStatusText"></h3>
            <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 15px 0;">
            <div style="text-align: right; font-size: 0.9rem; color: #aaa;">
                <p>📦 المنتج: <span id="resProduct" style="color: #fff;"></span></p>
                <p>💰 القيمة: <span id="resPrice" style="color: #fff;"></span></p>
                <p>📅 التاريخ: <span id="resDate" style="color: #fff;"></span></p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('trackBtn').addEventListener('click', async () => {
            const orderId = document.getElementById('orderIdInput').value.trim();
            const resultDiv = document.getElementById('statusResult');
            
            if (!orderId) {
                alert('الرجاء إدخال رقم الطلب أولاً');
                return;
            }

            try {
                const res = await fetch(`/api/orders/track/${orderId}`);
                const data = await res.json();

                if (data.success) {
                    resultDiv.style.display = 'block';
                    const order = data.order;
                    
                    let statusAr = '';
                    let statusCls = '';
                    
                    switch(order.status) {
                        case 'pending': statusAr = '⏳ قيد المراجعة والتدقيق'; statusCls = 'status-pending'; break;
                        case 'completed': statusAr = '✅ تم التسليم بنجاح'; statusCls = 'status-completed'; break;
                        case 'failed': statusAr = '❌ فشل الطلب / ملغى'; statusCls = 'status-failed'; break;
                        default: statusAr = order.status;
                    }

                    document.getElementById('orderStatusText').innerText = statusAr;
                    document.getElementById('orderStatusText').className = statusCls;
                    document.getElementById('resProduct').innerText = order.productName;
                    document.getElementById('resPrice').innerText = order.price + '$';
                    document.getElementById('resDate').innerText = new Date(order.createdAt).toLocaleDateString('ar-EG');
                } else {
                    alert(data.error);
                    resultDiv.style.display = 'none';
                }
            } catch (err) {
                alert('حدث خطأ في الاتصال بالسيرفر');
            }
        });
    </script>
</body>
</html>
