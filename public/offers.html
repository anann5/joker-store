<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>العروض الخاصة | Joker Store</title>
    <meta name="description" content="اكتشف أفضل العروض والخصومات الحالية في متجر Joker Store. أكواد أصلية بأسعار مميزة.">
    <link rel="canonical" href="/offers">
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="page-shell">
        <header class="main-header">
            <a href="/" class="logo"><img src="/image/logo.png" alt="Joker Store"></a>
            <nav><a href="/" data-i18n-key="nav_home">الرئيسية</a></nav>
        </header>

        <section class="hero" style="padding:60px 20px;text-align:center;">
            <h1 style="font-size:2.2rem;margin-bottom:10px;"><i class="fas fa-fire" style="color:var(--primary-neon);"></i> <span data-i18n-key="offers_title">العروض الخاصة</span></h1>
            <p style="color:var(--text-muted);font-size:1.1rem;" data-i18n-key="offers_subtitle">اكتشف أفضل الخصومات والحالات المتاحة الآن</p>
        </section>

        <div id="offersContainer" class="products-grid" style="max-width:1100px;margin:0 auto;padding:0 16px 60px;">
            <div class="loader-container" style="grid-column:1/-1;text-align:center;padding:60px 0;">
                <i class="fas fa-spinner fa-spin" style="font-size:2rem;color:var(--primary-neon);"></i>
            </div>
        </div>
    </div>

    <script type="module">
        import { t, getCurrentLanguage } from '/i18n.js';

        async function loadOffers() {
            const container = document.getElementById('offersContainer');
            try {
                const res = await fetch('/api/promotions');
                const data = await res.json();
                if (!data.success || !data.promotions || data.promotions.length === 0) {
                    container.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:60px 0;color:var(--text-muted);"><i class="fas fa-tag" style="font-size:3rem;margin-bottom:16px;display:block;opacity:0.3;"></i><p data-i18n_key="offers_empty">لا توجد عروض نشطة حالياً</p></div>`;
                    return;
                }

                const lang = getCurrentLanguage();
                container.innerHTML = data.promotions.map(promo => {
                    const title = promo.title?.[lang] || promo.title?.ar || '';
                    const desc = promo.description?.[lang] || promo.description?.ar || '';
                    const discount = promo.discountPercent || 0;
                    const expiresAt = promo.expiresAt ? new Date(promo.expiresAt) : null;
                    const products = promo.products || [];

                    return `
                        <div class="product-item-card" style="grid-column:1/-1;margin-bottom:20px;">
                            <div style="padding:24px;">
                                <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">
                                    <span style="background:var(--primary-neon);color:#000;padding:6px 14px;border-radius:20px;font-weight:900;font-size:1.1rem;">-${discount}%</span>
                                    <h3 style="margin:0;font-size:1.3rem;">${escapeHtml(title)}</h3>
                                </div>
                                ${desc ? `<p style="color:var(--text-muted);margin-bottom:12px;">${escapeHtml(desc)}</p>` : ''}
                                ${expiresAt ? `<p style="color:var(--danger);font-size:0.85rem;margin-bottom:16px;"><i class="fas fa-clock"></i> ينتهي: ${expiresAt.toLocaleDateString('ar-EG')}</p>` : ''}
                                ${products.length > 0 ? `
                                    <div class="products-grid" style="gap:12px;">
                                        ${products.map(p => {
                                            const name = p.productName?.[lang] || p.productName?.ar || '';
                                            const salePrice = p.salePrice || p.price;
                                            return `
                                                <div class="product-item-card" data-product-id="${p._id}" style="cursor:pointer;">
                                                    <img src="${p.image || '/image/logo.png'}" alt="${escapeHtml(name)}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:var(--radius-md);">
                                                    <div style="padding:10px;">
                                                        <div style="font-size:0.85rem;font-weight:700;margin-bottom:4px;">${escapeHtml(name)}</div>
                                                        <div style="display:flex;gap:8px;align-items:center;">
                                                            <span style="color:var(--primary-neon);font-weight:900;">${salePrice.toFixed(2)} ₪</span>
                                                            ${p.price !== salePrice ? `<span style="text-decoration:line-through;color:var(--text-muted);font-size:0.8rem;">${p.price.toFixed(2)} ₪</span>` : ''}
                                                        </div>
                                                    </div>
                                                </div>
                                            `;
                                        }).join('')}
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (_err) {
                container.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:60px 0;color:var(--danger);">❌ فشل تحميل العروض</div>`;
            }
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str || '';
            return div.innerHTML;
        }

        loadOffers();
    </script>
</body>
</html>
