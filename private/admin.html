<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم جوكر ستور — إدارة المنتجات</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #1f2833;
            --primary: #a200ff;
            --primary-hover: #7b00cc;
            --text-color: #c5c6c7;
            --accent: #45f3ff;
            --danger: #ff3333;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 20px;
        }

        h1 { color: #fff; margin: 0; font-size: 28px; }
        h1 span { color: var(--accent); }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
        }

        @media(min-width: 992px) {
            .grid { grid-template-columns: 380px 1fr; }
        }

        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(162, 0, 255, 0.1);
            border: 1px solid rgba(162, 0, 255, 0.2);
            height: fit-content;
        }

        .card h2 { color: #fff; margin-top: 0; font-size: 20px; margin-bottom: 20px; }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            background: #151a21;
            border: 1px solid #334155;
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }
        input:focus, select:focus { border-color: var(--primary); outline: none; }

        button {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            font-size: 16px;
            transition: 0.3s;
        }
        button:hover { background: var(--primary-hover); }

        .inventory-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        th, td { padding: 12px 15px; text-align: right; border-bottom: 1px solid #2d3748; }
        th { background-color: rgba(162, 0, 255, 0.3); color: #fff; font-weight: 700; }
        tr:hover { background: rgba(255,255,255,0.02); }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }
        .badge.instock { background: rgba(69, 243, 255, 0.2); color: var(--accent); }
        .badge.outstock { background: rgba(255, 51, 51, 0.2); color: var(--danger); }

        .btn-actions { display: flex; gap: 8px; }
        .btn-edit { background: #e67e22; width: auto; padding: 6px 12px; font-size: 13px; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;}
        .btn-edit:hover { background: #d35400; }
        .btn-delete { background: var(--danger); width: auto; padding: 6px 12px; font-size: 13px; color: #fff; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;}
        .btn-delete:hover { background: #cc0000; }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center; align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            width: 400px;
            border: 1px solid var(--primary);
        }
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
        .btn-cancel { background: #555; }
        .btn-cancel:hover { background: #444; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>لوحة تحكم <span>JOKER STORE</span> 🃏</h1>
        <p>إدارة المنتجات، الأسعار، والمخزون الحالي لايف</p>
    </header>

    <div class="grid">
        <div class="card">
            <h2>➕ إضافة بطاقات جديدة</h2>
            <form id="addForm">
                <div class="form-group">
                    <label>اسم المنتج (مثل: 60 UC PUBG):</label>
                    <input type="text" id="prodName" required placeholder="ادخل اسم الكرت بدقة">
                </div>
                <div class="form-group">
                    <label>القسم (Category):</label>
                    <select id="prodCategory">
                        <option value="pubg">ببجي</option>
                        <option value="fortnite">فورتنايت</option>
                        <option value="playstation">بلايستيشن</option>
                        <option value="xbox">إكس بوكس</option>
                        <option value="windows">ويندوز</option>
                        <option value="adobe">أدوبي</option>
                        <option value="security">الحماية</option>
                        <option value="vpn">VPN</option>
                        <option value="googleplay">جوجل بلاي</option>
                        <option value="itunes">آيتونز</option>
                        <option value="razergold">ريزر جولد</option>
                        <option value="amazon">أمازون</option>
                        <option value="games">الألعاب</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>المنطقة (Region):</label>
                    <select id="prodRegion">
                        <option value="global">عالمي</option>
                        <option value="tr">تركي</option>
                        <option value="ae">إماراتي</option>
                        <option value="sa">سعودي</option>
                        <option value="vn">فيتنامي</option>
                        <option value="cn">صيني</option>
                        <option value="usa">أمريكي</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>السعر ($):</label>
                    <input type="number" id="prodPrice" step="0.01" required placeholder="السعر بالدولار">
                </div>
                <div class="form-group">
                    <label>الأكواد (كود في كل سطر):</label>
                    <textarea id="prodCodes" rows="5" required placeholder="AAAA-BBBB-CCCC&#10;DDDD-EEEE-FFFF"></textarea>
                </div>
                <button type="submit">حفظ وإضافة للمخزن 🚀</button>
            </form>
        </div>

        <div>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h2 style="margin: 0; font-size: 22px; color: #fff;">📦 المنتجات المعروضة حالياً بالمتجر</h2>
                <button id="refreshBtn" style="width: auto; padding: 6px 15px; font-size: 13px; background: #34495e;">تحديث البيانات 🔄</button>
            </div>
            <table class="inventory-table">
                <thead>
                    <tr>
                        <th>المنتج</th>
                        <th>القسم</th>
                        <th>المنطقة</th>
                        <th>السعر</th>
                        <th>المتاح (المخزون)</th>
                        <th>إجراءات</th>
                    </tr>
                </thead>
                <tbody id="inventoryBody">
                    <tr>
                        <td colspan="6" style="text-align: center; padding: 30px;">جاري تحميل المنتجات من السيرفر...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal" id="editModal">
    <div class="modal-content">
        <h3 style="margin-top: 0; color: #fff; border-bottom: 1px solid var(--primary); padding-bottom: 10px;">✏️ تعديل بيانات البطاقة</h3>
        <input type="hidden" id="editId">
        <div class="form-group">
            <label>اسم المنتج:</label>
            <input type="text" id="editName" required>
        </div>
        <div class="form-group">
            <label>القسم:</label>
            <select id="editCategory">
                <option value="pubg">ببجي</option>
                <option value="fortnite">فورتنايت</option>
                <option value="playstation">بلايستيشن</option>
                <option value="xbox">إكس بوكس</option>
                <option value="windows">ويندوز</option>
                <option value="adobe">أدوبي</option>
                <option value="security">الحماية</option>
                <option value="vpn">VPN</option>
                <option value="googleplay">جوجل بلاي</option>
                <option value="itunes">آيتونز</option>
                <option value="razergold">ريزر جولد</option>
                <option value="amazon">أمازون</option>
                <option value="games">الألعاب</option>
            </select>
        </div>
        <div class="form-group">
            <label>المنطقة:</label>
            <select id="editRegion">
                <option value="global">عالمي</option>
                <option value="tr">تركي</option>
                <option value="ae">إماراتي</option>
                <option value="sa">سعودي</option>
                <option value="vn">فيتنامي</option>
                <option value="cn">صيني</option>
                <option value="usa">أمريكي</option>
            </select>
        </div>
        <div class="form-group">
            <label>السعر ($):</label>
            <input type="number" id="editPrice" step="0.01" required>
        </div>
        <div class="modal-actions">
            <button id="saveEditBtn">حفظ التعديلات ✅</button>
            <button class="btn-cancel" id="closeModalBtn">إلغاء</button>
        </div>
    </div>
</div>

<script>
    const token = localStorage.getItem('adminToken');
    if (!token) {
        window.location.replace('/admin-login');
    }

    // قاموس لتحويل القيم البرمجية إلى نصوص عربية مفهومة داخل الجدول
    const translateMap = {
        pubg: 'ببجي', fortnite: 'فورتنايت', playstation: 'بلايستيشن', xbox: 'إكس بوكس',
        windows: 'ويندوز', adobe: 'أدوبي', security: 'الحماية', vpn: 'VPN',
        googleplay: 'جوجل بلاي', itunes: 'آيتونز', razergold: 'ريزر جولد', amazon: 'أمازون', games: 'الألعاب',
        global: 'عالمي', tr: 'تركي', ae: 'إماراتي', sa: 'سعودي', vn: 'فيتنامي', cn: 'صيني', usa: 'أمريكي'
    };

    async function loadInventory() {
        if (!token) return;
        try {
            const res = await fetch('/api/admin/inventory', {
                headers: { 'x-admin-token': token }
            });
            
            if (res.status === 401) {
                localStorage.removeItem('adminToken');
                window.location.replace('/admin-login');
                return;
            }

            const data = await res.json();
            if (!data.success) {
                alert(data.error || 'فشلت عملية جلب البيانات');
                return;
            }

            const tbody = document.getElementById('inventoryBody');
            tbody.innerHTML = '';

            if (data.inventory.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; padding: 20px;">لا يوجد منتجات مضافة حالياً. ابدأ بإضافة أول كرت!</td></tr>`;
                return;
            }

            data.inventory.forEach(item => {
                const tr = document.createElement('tr');
                const badgeClass = item.available > 0 ? 'instock' : 'outstock';
                const badgeText = item.available > 0 ? `${item.available} كود متاح` : 'خلص المخزون ⚠️';
                
                const displayCategory = translateMap[item.category] || item.category;
                const displayRegion = translateMap[item.region] || item.region;

                tr.innerHTML = `
                    <td style="font-weight: bold; color: #fff;">${item.productName}</td>
                    <td><span style="color: #bdc3c7;">${displayCategory}</span></td>
                    <td><span style="color: #45f3ff; font-weight: 600;">${displayRegion}</span></td>
                    <td style="color: #2ecc71; font-weight: bold;">$${item.price}</td>
                    <td><span class="badge ${badgeClass}">${badgeText}</span></td>
                    <td>
                        <div class="btn-actions">
                            <button class="btn-edit" data-id="${item.id}" data-name="${item.productName}" data-category="${item.category}" data-region="${item.region}" data-price="${item.price}">تعديل</button>
                            <button class="btn-delete" data-id="${item.id}">حذف</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            // ربط أحداث الضغط برمجياً للأزرار لتعمل بشكل فوري ومضمون
            document.querySelectorAll('.btn-edit').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const target = e.target.tagName === 'BUTTON' ? e.target : e.target.parentElement;
                    openEditModal(target.dataset.id, target.dataset.name, target.dataset.category, target.dataset.region, target.dataset.price);
                });
            });

            document.querySelectorAll('.btn-delete').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const target = e.target.tagName === 'BUTTON' ? e.target : e.target.parentElement;
                    deleteProduct(target.dataset.id);
                });
            });

        } catch (err) {
            console.error('Inventory Load Error:', err);
        }
    }

    // نموذج الإضافة
    document.getElementById('addForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const codesArray = document.getElementById('prodCodes').value.split('\n').filter(c => c.trim().length > 0);
        
        const payload = {
            productName: document.getElementById('prodName').value,
            category: document.getElementById('prodCategory').value,
            region: document.getElementById('prodRegion').value,
            price: parseFloat(document.getElementById('prodPrice').value),
            codes: codesArray
        };

        const res = await fetch('/api/admin/add-codes', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'x-admin-token': token },
            body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (data.success) {
            alert(data.message);
            document.getElementById('addForm').reset();
            loadInventory();
        } else {
            alert(data.message || data.error);
        }
    });

    function openEditModal(id, name, cat, reg, price) {
        document.getElementById('editId').value = id;
        document.getElementById('editName').value = name;
        document.getElementById('editCategory').value = cat;
        document.getElementById('editRegion').value = reg;
        document.getElementById('editPrice').value = price;
        document.getElementById('editModal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('editModal').style.display = 'none';
    }

    async function submitEdit() {
        const id = document.getElementById('editId').value;
        const payload = {
            productName: document.getElementById('editName').value,
            category: document.getElementById('editCategory').value,
            region: document.getElementById('editRegion').value,
            price: parseFloat(document.getElementById('editPrice').value)
        };

        const res = await fetch(`/api/admin/products/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', 'x-admin-token': token },
            body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (data.success) {
            alert(data.message);
            closeModal();
            loadInventory();
        } else {
            alert(data.message || data.error);
        }
    }

    async function deleteProduct(id) {
        if (!confirm('هل أنت متأكد تماماً أنك تريد حذف هذا المنتج من المتجر؟')) return;

        const res = await fetch(`/api/admin/products/${id}`, {
            method: 'DELETE',
            headers: { 'x-admin-token': token }
        });
        const data = await res.json();

        if (data.success) {
            alert(data.message);
            loadInventory();
        } else {
            alert(data.message || data.error);
        }
    }

    document.getElementById('refreshBtn').addEventListener('click', loadInventory);
    document.getElementById('saveEditBtn').addEventListener('click', submitEdit);
    document.getElementById('closeModalBtn').addEventListener('click', closeModal);

    window.onload = loadInventory;
</script>
</body>
</html>
