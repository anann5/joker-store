<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم JOKER STORE 🔒</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #1f2833;
            --primary: #a200ff;
            --primary-hover: #7b00cc;
            --text-color: #c5c6c7;
            --accent: #45f3ff;
            --danger: #ff3333;
            --success: #00ffcc;
            --warning: #ffaa00;
            --text-muted: #9ca3af;
            --border-color: rgba(255, 255, 255, 0.08);
            --primary-neon: #00f2fe;
            --secondary-neon: #0072ff;
            --accent-orange: #ff9f43;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #0a0a19 0%, #0f0820 40%, #140823 100%);
            color: var(--text-color);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
        }

        /* ===== Header ===== */
        header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
        }

        header h1 {
            color: #fff;
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        header h1 span {
            color: var(--primary);
            text-shadow: 0 0 15px rgba(162, 0, 255, 0.5);
        }

        .admin-meta {
            margin-top: 12px;
            color: var(--text-muted);
            font-size: 0.85rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .logout-btn {
            background: rgba(255, 51, 51, 0.15);
            color: var(--danger);
            border: 1px solid rgba(255, 51, 51, 0.3);
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background: rgba(255, 51, 51, 0.3);
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.4);
        }

        /* ===== Tabs & Nav ===== */
        .nav-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 8px;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-color);
            padding: 10px 22px;
            border-radius: 10px;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-weight: 600;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        .tab-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
            box-shadow: 0 0 20px rgba(162, 0, 255, 0.4);
        }

        /* ===== Cards & Tables ===== */
        .card {
            background: rgba(31, 40, 51, 0.7);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(162, 0, 255, 0.1);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.4);
            margin-bottom: 25px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .section-title {
            color: #fff;
            border-right: 4px solid var(--primary);
            padding-right: 12px;
            font-size: 1.3rem;
            font-weight: 700;
        }

        .btn {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 9px 18px;
            border-radius: 8px;
            font-size: 0.88rem;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            transition: all 0.25s;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 0 15px rgba(162, 0, 255, 0.35);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.12);
            color: var(--text-color);
        }

        .btn-reject {
            background: linear-gradient(135deg, #ff4757, #e74c3c);
            color: white;
            box-shadow: 0 0 10px rgba(231, 76, 60, 0.3);
        }

        .btn-reject:hover {
            box-shadow: 0 0 20px rgba(231, 76, 60, 0.5);
        }

        .btn-approve {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
            color: white;
            box-shadow: 0 0 10px rgba(46, 204, 113, 0.3);
        }

        .btn-approve:hover {
            box-shadow: 0 0 20px rgba(46, 204, 113, 0.5);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
            font-size: 0.9rem;
            overflow: hidden;
            border-radius: 10px;
        }

        thead th {
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            padding: 12px 15px;
            text-align: right;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: 0.8rem;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            text-align: right;
        }

        tbody tr:hover {
            background: rgba(162, 0, 255, 0.04);
        }

        /* ===== Status Badges ===== */
        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 700;
            white-space: nowrap;
        }

        .badge-accent {
            background: rgba(69, 243, 255, 0.12);
            color: var(--accent);
            border: 1px solid rgba(69, 243, 255, 0.2);
        }

        .badge-success {
            background: rgba(0, 255, 204, 0.12);
            color: var(--success);
            border: 1px solid rgba(0, 255, 204, 0.2);
        }

        .badge-warning {
            background: rgba(255, 170, 0, 0.12);
            color: var(--warning);
            border: 1px solid rgba(255, 170, 0, 0.3);
        }

        .badge-danger {
            background: rgba(255, 51, 51, 0.12);
            color: var(--danger);
            border: 1px solid rgba(255, 51, 51, 0.3);
        }

        /* ===== Action Icons ===== */
        .action-icon {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.05rem;
            margin-left: 8px;
            transition: transform 0.2s, color 0.3s;
            padding: 4px 6px;
            border-radius: 4px;
        }

        .btn-edit {
            color: var(--accent);
        }

        .btn-delete {
            color: var(--danger);
        }

        .action-icon:hover {
            transform: scale(1.15);
        }

        .action-btns-group {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        /* ===== Modals ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(7, 7, 13, 0.88);
            backdrop-filter: blur(10px);
            z-index: 999;
            display: none;
            align-items: center;
            justify-content: center;
            transition: opacity 0.3s ease-in-out;
            opacity: 0;
            overflow-y: auto;
        }

        .modal-overlay.active {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 15px;
            border: 1px solid var(--border-color);
            box-shadow: 0 0 40px rgba(162, 0, 255, 0.3);
            width: 100%;
            max-width: 560px;
            margin: 20px;
            position: relative;
            max-height: 85vh;
            overflow-y: auto;
        }

        .close-modal-btn {
            position: absolute;
            top: 18px;
            inset-inline-end: 22px;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 28px;
            cursor: pointer;
            line-height: 1;
            transition: all 0.3s;
        }

        .close-modal-btn:hover {
            color: var(--primary-neon);
            transform: rotate(90deg);
        }

        .modal-title {
            margin-top: 0;
            color: var(--primary);
            margin-bottom: 22px;
            font-size: 1.3rem;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #fff;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .form-control {
            width: 100%;
            padding: 11px 14px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-family: 'Cairo', sans-serif;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s;
        }

        .form-control:focus {
            border-color: var(--primary-neon);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        .form-row-full {
            grid-column: 1 / -1;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 22px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-neon), var(--secondary-neon));
            color: #0a0a19;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.6);
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 45px;
            height: 24px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.1);
            transition: 0.4s;
            border-radius: 24px;
            border: 1px solid var(--border-color);
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background: var(--text-muted);
            transition: 0.4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background: linear-gradient(135deg, var(--primary-neon), var(--secondary-neon));
        }

        input:checked + .slider:before {
            transform: translateX(21px);
        }

        /* ===== Stock & Price Cells ===== */
        .stock-status {
            font-size: 0.85rem;
            font-weight: 600;
        }

        .stock-available {
            color: #2ecc71;
        }

        .stock-low {
            color: var(--accent-orange);
        }

        .stock-empty {
            color: var(--danger);
        }

        .stock-external {
            color: #9b59b6;
        }

        .price-normal {
            color: var(--text-muted);
        }

        .price-low-profit {
            color: var(--danger);
            font-weight: bold;
        }

        .product-name-cell {
            font-weight: bold;
            color: #fff;
        }
        .product-name-secondary {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .price-cell {
            color: var(--accent);
            font-weight: bold;
        }

        .customer-name-cell {
            font-weight: 600;
            color: #fff;
        }

        .customer-email-cell {
            color: var(--accent);
            font-weight: bold;
        }

        .loading-cell {
            text-align: center;
            color: var(--text-muted);
        }

        .error-cell {
            text-align: center;
            color: var(--danger);
        }

        /* ===== Hidden utility ===== */
        .hidden {
            display: none !important;
        }

        /* ===== Loading Spinner ===== */
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: var(--primary-neon);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== Responsive ===== */
        @media (max-width: 768px) {
            .form-row { grid-template-columns: 1fr; }
            .controls { flex-direction: column; align-items: flex-start; }
            header h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>لوحة تحكم <span>JOKER STORE</span></h1>
            <div class="admin-meta">
                <span><i class="fas fa-shield-alt"></i> خاص بالإدارة فقط</span>
                <span id="currentDate"></span>
                <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> تسجيل الخروج</button>
            </div>
        </header>

        <!-- Navigation Tabs -->
        <div class="nav-tabs">
            <button class="tab-btn active" id="inventoryTabBtn"><i class="fas fa-boxes"></i> إدارة المخزون</button>
            <button class="tab-btn" id="ordersTabBtn"><i class="fas fa-file-invoice-dollar"></i> الطلبات والفواتير</button>
        </div>

        <!-- Inventory Section -->
        <section id="inventorySection" class="card">
            <div class="controls">
                <h2 class="section-title">المخزون الحالي بالمتجر</h2>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <button class="btn" id="refreshBtn"><i class="fas fa-sync-alt"></i> تحديث القائمة</button>
                    <span class="toggle-switch">
                        <input type="checkbox" id="soundToggle" checked>
                        <span class="slider"></span>
                    </span>
                    <span id="soundIcon" class="fas fa-volume-up" style="color: var(--accent);"></span>
                </div>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>اسم المنتج</th>
                        <th>الفئة</th>
                        <th>المنطقة</th>
                        <th>السعر</th>
                        <th>الحالة</th>
                        <th>العمليات</th>
                    </tr>
                </thead>
                <tbody id="inventoryList">
                    <tr><td colspan="6" class="loading-cell">جاري تحميل المنتجات...</td></tr>
                </tbody>
            </table>
        </section>

        <!-- Orders Section -->
        <section id="ordersSection" class="card hidden">
            <div class="controls">
                <h2 class="section-title">سجل عمليات وفواتير الزبائن</h2>
                <button class="btn btn-secondary" id="refreshOrdersBtn"><i class="fas fa-redo"></i> تحديث الطلبات</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>الزبون</th>
                        <th>البريد الإلكتروني</th>
                        <th>المنتجات المشحونة</th>
                        <th>إجمالي المبلغ</th>
                        <th>الحالة</th>
                    </tr>
                </thead>
                <tbody id="ordersList">
                    <tr><td colspan="5" class="loading-cell">جاري جلب الفواتير من النظام...</td></tr>
                </tbody>
            </table>
        </section>
    </div>

    <!-- Modal لتعديل المنتج -->
    <div class="modal-overlay" id="editModal">
        <div class="modal-content">
            <button class="close-modal-btn" id="closeModalBtn">×</button>
            <h3 class="modal-title"><i class="fas fa-edit"></i> تعديل بيانات المنتج</h3>
            <input type="hidden" id="editId">
            <div class="form-group">
                <label>اسم المنتج</label>
                <input type="text" id="editName" class="form-control">
            </div>
            <div class="form-group">
                <label>السعر (دولار)</label>
                <input type="number" id="editPrice" step="0.01" class="form-control">
            </div>
            <div class="form-group">
                <label>هامش الربح (×)</label>
                <input type="number" id="editMargin" step="0.01" class="form-control" value="1.15">
            </div>
            <div class="modal-actions">
                <button class="btn btn-secondary" id="cancelEditBtn">إلغاء</button>
                <button class="btn btn-primary" id="saveEditBtn"><i class="fas fa-save"></i> حفظ التغييرات</button>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" style="position: fixed; top: 20px; inset-inline-end: 20px; z-index: 1000;"></div>

    <script src="admin.js"></script>
</body>
</html>
