services:
  - type: web
    name: joker-store
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      # فرض HTTPS مفعّل افتراضياً في الإنتاج (Render يمرر x-forwarded-proto: https).
      # لا تضبط FORCE_HTTPS هنا — يبقى مفعّلاً.
      - key: PORT
        value: 10000
      # ⚠️ عيّن قيماً حقيقية في لوحة Render (Dashboard → Environment)
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      # يُولّد بأمر: node scripts/generate-totp.js — تركه فارغاً يعطّل 2FA
      - key: ADMIN_TOTP_SECRET
        sync: false
      - key: JWT_USER_SECRET
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      # ضع قيمة SITE_URL في لوحة Render بعد أول ديبلوي (مثلاً https://joker-store.onrender.com)
      - key: SITE_URL
        sync: false
      # أرقام الدفع وروابط التواصل — املأها في لوحة Render
      - key: JAWWAL_PAY_NUMBER
        sync: false
      - key: PALPAY_NUMBER
        sync: false
      - key: REFLECT_NUMBER
        sync: false
      - key: WHATSAPP_NUMBER
        sync: false
      - key: TELEGRAM_LINK
        sync: false
      - key: INSTAGRAM_LINK
        sync: false
      - key: TIKTOK_LINK
        sync: false
      # SMTP (اختياري) — Hotmail/Outlook: استخدم App Password وليس كلمة مرور الحساب
      - key: EMAIL_NOTIFICATIONS_ENABLED
        value: "true"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      # Cloudflare R2 — تخزين دائم لصور المتجر وإثباتات الدفع (مجاني حتى 10GB).
      # أنشئ دلوًا خاصًا وAPI Token بصلاحية Object Read & Write على الدلو فقط.
      # عند تركها فارغة يعمل التطبيق بتخزين محلي مؤقت (يُفقد عند النشر).
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
