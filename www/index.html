<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Joker Store</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            background: #0B0F1C;
            font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
            color: #EDF1F8;
        }
        .logo { width: 96px; height: 96px; border-radius: 22px; }
        .brand { font-size: 1.3rem; font-weight: 800; letter-spacing: .5px; }
        .hint { font-size: .85rem; color: #8A94A8; }
        .spinner {
            width: 26px; height: 26px;
            border: 3px solid rgba(129, 140, 248, .25);
            border-top-color: #818CF8;
            border-radius: 50%;
            animation: spin .8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <img class="logo" src="icon.png" alt="Joker Store">
    <div class="brand">Joker Store</div>
    <div class="spinner"></div>
    <div class="hint">جاري تحميل المتجر…</div>
    <script>
        if (location.hostname !== 'localhost') {
            location.replace('https://joker-store.onrender.com' + (location.search || '') + (location.hash || ''));
        }
    </script>
</body>
</html>
