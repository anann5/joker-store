name: Uptime

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  health:
    name: Health check
    runs-on: ubuntu-24.04
    steps:
      - name: Ping /health
        id: health
        run: |
          code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 25 https://joker-store.onrender.com/health || true)
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "HTTP $code"
          cat /tmp/health.json 2>/dev/null || true
          test "$code" = "200"

      - name: Alert on Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not configured; skipping alert."
            exit 0
          fi
          text="ALERT: Joker Store is down (HTTP ${{ steps.health.outputs.code }}). https://joker-store.onrender.com/health"
          curl -sS --max-time 20 -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}"
