name: Uptime

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  health:
    name: Health check
    runs-on: ubuntu-24.04
    env:
      # يُضبط في Settings → Variables كـ SITE_URL عند الانتقال لنطاق خاص.
      SITE_URL: ${{ vars.SITE_URL || 'https://joker-store.onrender.com' }}
    steps:
      - name: Ping /health
        id: health
        run: |
          SITE_URL="${SITE_URL%/}"
          code=000
          for attempt in 1 2 3 4 5; do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 25 "$SITE_URL/health" || true)
            echo "attempt $attempt: HTTP $code"
            if [ "$code" = "200" ]; then break; fi
            sleep 15
          done
          echo "code=$code" >> "$GITHUB_OUTPUT"
          cat /tmp/health.json 2>/dev/null || true
          test "$code" = "200"

      - name: Alert on Telegram
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          SITE_URL="${SITE_URL%/}"
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not configured; skipping alert."
            exit 0
          fi
          text="ALERT: Joker Store is down (HTTP ${{ steps.health.outputs.code }}). ${SITE_URL}/health"
          curl -sS --max-time 20 -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}"
