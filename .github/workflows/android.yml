name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'capacitor.config.json'
      - 'www/**'
      - '.github/workflows/android.yml'
      - 'public/image/icon-*.png'
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          set -e
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME"
          cd "$ANDROID_HOME"
          curl -fsSL -o cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          unzip -q cmdline-tools.zip
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          mv cmdline-tools/bin cmdline-tools/lib "$ANDROID_HOME/cmdline-tools/latest/"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      - name: Install Capacitor
        run: |
          npm install --save @capacitor/core@7 @capacitor/android@7
          npm install --save-dev @capacitor/cli@7
          npx cap --version

      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then npx cap add android; fi
          cp public/image/icon-512.png www/icon.png
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          npx cap sync android

      - name: Build release APK (unsigned)
        id: build
        working-directory: android
        run: |
          chmod +x gradlew
          set -o pipefail
          {
            echo "=== variables.gradle ==="
            cat variables.gradle 2>/dev/null || true
            echo "=== local.properties ==="
            cat local.properties 2>/dev/null || true
            echo "=== SDK dirs ==="
            ls "$ANDROID_HOME/platforms" 2>/dev/null || true
            ls "$ANDROID_HOME/build-tools" 2>/dev/null || true
            echo "=== gradle build ==="
          } > build.log
          ./gradlew assembleRelease --no-daemon --stacktrace >> build.log 2>&1

      - name: Report build failure
        if: failure() && steps.build.outcome == 'failure'
        run: |
          tail -c 25000 android/build.log > error-report.txt 2>/dev/null || true
          {
            echo "### Android build failed — run #$GITHUB_RUN_NUMBER"
            echo ""
            echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo ""
            echo '```'
            cat error-report.txt
            echo '```'
          } > issue-body.md
          gh label create build --description "Automated build failures" --color B60205 || true
          gh issue create --title "Android build failed (run #$GITHUB_RUN_NUMBER)" --body-file issue-body.md || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: android/build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: jokerstore
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
          APK_IN="$GITHUB_WORKSPACE/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          APK_ALIGNED="$GITHUB_WORKSPACE/app-aligned.apk"
          APK_OUT="$GITHUB_WORKSPACE/joker-store.apk"
          "$BUILD_TOOLS/zipalign" -p -f 4 "$APK_IN" "$APK_ALIGNED"
          "$BUILD_TOOLS/apksigner" sign --ks "$GITHUB_WORKSPACE/release.keystore" --ks-pass "pass:$KEYSTORE_PASSWORD" --ks-key-alias "$KEY_ALIAS" --key-pass "pass:$KEY_PASSWORD" --out "$APK_OUT" "$APK_ALIGNED"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK_OUT" | head -2
          ls -lh "$APK_OUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: joker-store-apk
          path: joker-store.apk
          if-no-files-found: error

      - name: Publish to GitHub Release (latest)
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Joker Store — APK
          body: |
            تطبيق Joker Store لأندرويد.

            **طريقة التثبيت:** حمّل الملف → افتحه → فعّل "التثبيت من مصادر غير معروفة" لو طُلب منك.
          files: joker-store.apk
          fail_on_unmatched_files: true
